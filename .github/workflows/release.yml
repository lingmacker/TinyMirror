name: Release TinyMirror

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build tools
        run: brew install cmake pkg-config

      - name: Resolve release version
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          if [[ -z "$version" || "$version" == "$TAG" ]]; then
            echo "Release tags must start with v" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build release package
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: ./scripts/package.sh

      - name: Verify media playback and stable window geometry
        run: bash scripts/check-media.sh

      - name: Verify packaged app startup
        run: python3 scripts/check-app.py dist/TinyMirror.app

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "dist/TinyMirror-$VERSION.dmg" --clobber
            gh release edit "$GITHUB_REF_NAME" \
              --title "TinyMirror $VERSION" --draft=false --latest
          else
            gh release create "$GITHUB_REF_NAME" \
              "dist/TinyMirror-$VERSION.dmg" \
              --title "TinyMirror $VERSION" --generate-notes
          fi
