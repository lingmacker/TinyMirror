name: Release TinyMirror

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build tools
        run: brew install cmake pkg-config

      - name: Resolve release version
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          if [[ -z "$version" || "$version" == "$TAG" ]]; then
            echo "Release tags must start with v" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build release package
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: ./scripts/package.sh

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "dist/TinyMirror-$VERSION.dmg" \
            --title "TinyMirror $VERSION" \
            --generate-notes \
            --notes "macOS 26+ release. The app and disk image use ad-hoc signing and are not notarized."
